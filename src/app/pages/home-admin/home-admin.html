<main class="container">
  <h1 class="title">TigasNews Blog</h1>

  <button class="menu" mat-button [matMenuTriggerFor]="menu">
    Admin
  </button>

  <mat-menu #menu="matMenu" class="theme-menu">
    <button (click)="createPost()" mat-menu-item>Create</button>
    <button (click)="updatePost()" mat-menu-item>Update</button>
    <button (click)="deletePost()" mat-menu-item>Delete</button>
  </mat-menu>

  <h2 class="project-header">Projetos</h2>

  @if (isLoading) {
    <h3>Carregando posts...</h3>
  }
  @else if (errorMessage) {
    <h3>{{errorMessage}}...</h3>
  }
  @else {
    <ul>
    @for (post of posts; track post.postId) {
        <li>
          <a class="post" [routerLink]="['/posts', post.postId]">{{post.title}}</a>
        </li>
    }
    </ul>
  }
</main>
