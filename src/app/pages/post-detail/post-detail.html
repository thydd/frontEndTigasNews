<main class="post">
  @if (isLoading) {
    <h3>Carregando conteudo...</h3>
  }
  @else if (errorMessage) {
    <h3>{{errorMessage}}</h3>
  }
  @else if (post) {
    <h1 class="title">{{post.title}}</h1>
    
    <div class="data">
      {{ post.createdDate | date:'d \'de\' MMMM \'de\' yyyy \'às\' HH:mm' }}
    </div>

    <article class="content">
      <p>
        {{post.description}}
      </p>
    </article>
  }
</main>
