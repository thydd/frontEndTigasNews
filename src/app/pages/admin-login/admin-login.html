<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="container">
  <h1>Login</h1>

  <div class="input-container">
    <input formControlName="username" placeholder="Username" type="text">
  </div>
  <div class="input-container"> 
    <input formControlName="password" placeholder="Password" type="password">
  </div>

  <div class="button-container">
    <button [disabled]="isLoading || loginForm.invalid" class="send-button" type="submit">
      {{isLoading ? 'Sending...' : 'OK'}}
    </button>
  </div>

  @if (errorMessage) {
    <p>{{errorMessage}}</p>
  }
</form>
