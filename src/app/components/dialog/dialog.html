<main>
  <h2 mat-dialog-title>{{data.title}}</h2>

  <mat-dialog-content>
    <p>{{data.message}}</p>
  </mat-dialog-content>

  @if (getDialogType() === 'create') {
    <form [formGroup]="dialogForm">
      <input class="inputTitle" formControlName="title" type="text" placeholder="title"/>
      <textarea class="inputDescription" formControlName="description" placeholder="description"></textarea>
    </form>
  }
  @else if (getDialogType() === 'update') {
    <form [formGroup]="dialogForm">
      <input class="inputId" formControlName="id" type="text" placeholder="id"/>
      <input class="inputTitle" formControlName="title" type="text" placeholder="title"/>
      <textarea class="inputDescription" formControlName="description" placeholder="description"></textarea>
    </form>
  }
  @else {
    <form [formGroup]="dialogForm">
      <input class="inputId" formControlName="id" type="text" placeholder="id"/>
    </form>
  }

  <mat-dialog-actions align="end">
    <button matButton (click)="close(false)">
      Cancel
    </button>

    <button mat-raised-button (click)="close(true)">
      OK
    </button>
  </mat-dialog-actions>
</main>
